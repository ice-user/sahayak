name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            server/requirements.txt
      # fastembed (ONNX + a ~220 MB model download) and streamlit (UI only) are skipped: the tests force
      # SAHAYAK_SEARCH=bm25, use fake LLM clients and a stand-in embedder, so nothing touches the network.
      # tests/test_app.py skips itself when streamlit is missing.
      - name: Install dependencies
        run: |
          grep -vEi '^(fastembed|streamlit)' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

  web:
    name: Web (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_MOCK: "1"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sahayak-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the container
        run: |
          docker run -d --name api -p 8000:8000 -e ENV=production -e ALLOWED_ORIGINS=https://example.vercel.app sahayak-api:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/health && exit 0; sleep 2; done
          docker logs api; exit 1
