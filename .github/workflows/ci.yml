name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            server/requirements.txt
      # fastembed (ONNX + a ~220 MB model download) and streamlit (UI only) are skipped: the tests force
      # SAHAYAK_SEARCH=bm25, use fake LLM clients and a stand-in embedder, so nothing touches the network.
      # tests/test_app.py skips itself when streamlit is missing.
      - name: Install dependencies
        run: |
          grep -vEi '^(fastembed|streamlit)' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider

  web:
    name: Web (lint, test, build)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_MOCK: "1"

  docker:
    name: Docker image builds
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sahayak-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the container
        run: |
          docker run -d --name api -p 8000:8000 -e ENV=production -e ALLOWED_ORIGINS=https://example.vercel.app sahayak-api:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/health && exit 0; sleep 2; done
          docker logs api; exit 1

  agent-evals:
    name: Agent evals (LLM judge, optional)
    # Never runs on push/PR: only manually or weekly, and only when the NVIDIA_API_KEY secret exists.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - name: Check for API key
        id: key
        run: |
          if [ -n "$NVIDIA_API_KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "NVIDIA_API_KEY not set; skipping"; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: |
          grep -vEi '^(fastembed|streamlit)' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt
      - name: Run agent evals with the judge
        if: steps.key.outputs.present == 'true'
        env:
          SAHAYAK_SEARCH: bm25
        run: python -m evals.run_agent_evals --judge --min-pass-rate 0.85 --min-faithfulness 4
      - name: Upload results
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-eval-results
          path: evals/results
